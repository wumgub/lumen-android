plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.lumen.ultralight'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lumen.ultralight'
        minSdk 25          // Android 7.1.1 and up
        targetSdk 34
        versionCode 8
        versionName '0.4.0'
    }

    buildTypes {
        release {
            // R8 / resource shrinking comes in a later phase once the app is
            // stable; Phase 0 ships an unminified debug-signed APK to prove CI.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        // Compatible with Kotlin 1.9.22.
        kotlinCompilerExtensionVersion '1.5.10'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    // ViewModel in Compose + coroutines
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Media3 playback + media session (background + lockscreen controls)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'

    // Album art loading (handles content:// URIs)
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Sampling an accent colour from album art (Blackout theme)
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // Local database for playlists / stats / overrides
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
