name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default package set tries the long-removed "tools" package and fails;
      # platform-tools plus what Gradle pulls is enough.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Sign every build with the same committed non-secret debug key so friends
      # can install updates over the top (matching signatures). Password is the
      # well-known "android".
      - name: Install shared debug signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the ref
        run: cp app/build/outputs/apk/debug/app-debug.apk "Lumen-Ultralight-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-ultralight-apk
          path: Lumen-Ultralight-*.apk

      - name: Attach to release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumen-Ultralight-*.apk
