name: Build APK

# Every push to main builds the APK and runs the unit tests, with the APK kept as
# a build artifact. Pushing a version tag also attaches it to that release:
#
#     git tag v0.4.0
#     git push --follow-tags
#
# You can run it by hand from the Actions tab too (workflow_dispatch).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Default package set tries the long-removed "tools" package and fails;
      # platform-tools plus what Gradle pulls is enough.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Sign every build with the same committed non-secret debug key, the one the
      # WebView app used too, so updates install over the top (Android only
      # allows that when signatures match). Password is the well-known "android".
      - name: Install shared debug signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Name the APK after the ref
        run: cp app/build/outputs/apk/debug/app-debug.apk "Lumen-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact (untagged runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: Lumen-*.apk

      - name: Attach to release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumen-*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
