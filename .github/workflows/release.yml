name: Build APK

# Push a version tag to build a sideloadable Android APK and attach it to the
# matching GitHub Release:
#
#     git tag v0.1.0
#     git push --follow-tags
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get the APK as a
# build artifact without publishing a release.
#
# The Android project (android/) is committed now that it carries native code
# (the MediaStore plugin), so CI no longer regenerates it — it just syncs the
# fresh web bundle into it with `cap sync` before building.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so the build can stamp itself with the commit SHA

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # Default package set includes the long-removed "tools" package, which
          # makes sdkmanager fail. The runner's preinstalled SDK + what Gradle
          # pulls is enough; only platform-tools needs ensuring.
          packages: platform-tools

      # android/ is committed; just copy the fresh web bundle + plugin config in.
      - name: Sync web assets
        run: npx cap sync android

      # Sign every build with the SAME debug key (committed at ci/debug.keystore),
      # instead of the random one Gradle would generate per run. Android only
      # allows installing an update over an existing app when the signature
      # matches, so a stable key is what lets friends update in place. A debug
      # keystore uses the well-known password "android" and grants no security —
      # it's safe to commit; its only job here is a consistent signature.
      - name: Use the shared debug signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Lumen-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: Lumen-*.apk

      - name: Publish to the Release (tagged runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumen-*.apk
