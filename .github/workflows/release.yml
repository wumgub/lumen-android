name: Build APK

# Push a version tag to build a sideloadable Android APK and attach it to the
# matching GitHub Release:
#
#     git tag v0.1.0
#     git push --follow-tags
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get the APK as a
# build artifact without publishing a release.
#
# The Android project (android/) isn't committed — it has no custom native code
# yet, so CI generates it fresh with `cap add android` each run. When we add a
# MediaStore plugin we'll commit android/ and drop that step.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so the build can stamp itself with the commit SHA

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # Default package set includes the long-removed "tools" package, which
          # makes sdkmanager fail. The runner's preinstalled SDK + what Gradle
          # pulls is enough; only platform-tools needs ensuring.
          packages: platform-tools

      # Generate the native Android project and copy the web bundle into it.
      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      # Debug-signed APK: installs fine for sideloading, and needs no signing
      # secrets. (A release-signed build comes once this is proven on a phone.)
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Lumen-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: Lumen-*.apk

      - name: Publish to the Release (tagged runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumen-*.apk
